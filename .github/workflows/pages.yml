# Превью сайта на GitHub Pages при каждом пуше в main.
# Включить: Settings → Pages → Source: GitHub Actions.
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      # Превью живёт по адресу /<репозиторий>/, а страница 404 открывается на любом адресе:
      # подставляем ей правильный корень, иначе она без стилей и с битой ссылкой на главную.
      - name: Корень сайта для страницы 404
        run: sed -i 's|<base href="/">|<base href="${{ steps.pages.outputs.base_path }}/">|' 404.html
      # Превью не для поисковиков: иначе недоделанный сайт попадёт в Яндекс и Google раньше запуска,
      # а потом станет дублем боевого домена. Страницы открываются по ссылке как обычно.
      # robots.txt не трогаем: если запретить в нём обход, робот не увидит noindex.
      # Чтобы превью было в поиске (концепт для портфолио), задайте переменную репозитория
      # PREVIEW_INDEX = true: Settings → Secrets and variables → Actions → Variables.
      - name: Закрыть превью от поисковиков
        if: vars.PREVIEW_INDEX != 'true'
        run: |
          find . -name '*.html' -not -path './.git/*' -not -path './.github/*' -print0 |
            while IFS= read -r -d '' f; do
              grep -q 'name="robots"' "$f" ||
                sed -i '0,/<head>/s|<head>|<head>\n  <meta name="robots" content="noindex">|' "$f"
            done
      # Служебные файлы Claude на сайт не нужны.
      - name: Убрать служебные папки
        run: rm -rf .claude
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
